
name: Lizard Android Bionic ARM64 AOT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Lizard
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip file binutils python3

      - name: Install Android NDK r27c
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$RUNNER_TEMP/android-ndk-r27c-linux.zip"
          URL="https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"

          curl --fail --location --retry 3 \
            "$URL" --output "$ARCHIVE"

          echo "090e8083a715fdb1a3e402d0763c388abb03fb4e  $ARCHIVE" \
            | sha1sum --check

          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP"

          NDK="$RUNNER_TEMP/android-ndk-r27c"
          NDK_BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$NDK_BIN/clang"
          test -x "$NDK_BIN/ld.lld"

          echo "$NDK_BIN" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Configure Lizard for Android AOT
        shell: bash
        run: |
          set -euo pipefail
          test -f Lizard.csproj

          python3 <<'PY'
          from pathlib import Path

          path = Path("Lizard.csproj")
          source = path.read_text(encoding="utf-8-sig")

          if "<TargetFramework>net8.0</TargetFramework>" not in source:
              raise SystemExit("ERROR: Expected .NET 8 target not found.")

          # Add the documented .NET 8 Android Bionic linker workaround.
          marker = '<LinkerArg Include="-Wl,--undefined-version" />'

          if marker not in source:
              item_group = """
            <ItemGroup Condition="'$(RuntimeIdentifier)' == 'linux-bionic-arm64'">
              <LinkerArg Include="-Wl,--undefined-version" />
            </ItemGroup>
          """
              if "</Project>" not in source:
                  raise SystemExit("ERROR: Missing closing Project element.")

              source = source.rsplit("</Project>", 1)[0]
              source += item_group + "\n</Project>\n"

          path.write_text(source, encoding="utf-8")
          print("Lizard project configured for Bionic linking.")
          PY

          grep -- '--undefined-version' Lizard.csproj

      - name: Publish Lizard NativeAOT ARM64
        shell: bash
        run: |
          set -euo pipefail

          rm -rf out

          dotnet publish Lizard.csproj \
            --configuration Release \
            --runtime linux-bionic-arm64 \
            --self-contained true \
            --output out \
            -p:PublishAot=true \
            -p:PublishAotUsingRuntimePack=true \
            -p:DisableUnsupportedError=true \
            -p:PlatformTarget=AnyCPU \
            -p:IlcInstructionSet=armv8.0 \
            -p:IS_AOT=true \
            -p:InvariantGlobalization=true

          test -s out/Lizard

      - name: Verify executable
        shell: bash
        run: |
          set -euo pipefail

          file out/Lizard

          readelf -h out/Lizard | grep -E 'Class:|Machine:'
          readelf -h out/Lizard | grep -q AArch64

          echo "ELF interpreter:"
          readelf -l out/Lizard \
            | grep 'Requesting program interpreter' || true

          echo "Dynamic dependencies:"
          readelf -d out/Lizard | grep NEEDED || true

          echo "SHA-256:"
          sha256sum out/Lizard

      - name: Upload Lizard Android ARM64
        uses: actions/upload-artifact@v4
        with:
          name: lizard-android-bionic-arm64
          path: out/Lizard
          if-no-files-found: error
