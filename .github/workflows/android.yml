name: Lizard Android Native AOT Build

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build-android:
    name: Lizard Android ARM64 Native AOT
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Android NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK_VERSION="27.2.12479018"
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found."
            find /usr/local/lib/android -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;$NDK_VERSION"

          NDK_ROOT="$SDK_ROOT/ndk/$NDK_VERSION"
          NDK_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$NDK_BIN/aarch64-linux-android35-clang"
          test -x "$NDK_BIN/aarch64-linux-android35-clang++"

          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_BIN=$NDK_BIN" >> "$GITHUB_ENV"
          echo "$NDK_BIN" >> "$GITHUB_PATH"

      - name: Verify ARM Support in Source
        shell: bash
        run: |
          set -euo pipefail

          grep -n 'AdvSimd' Logic/NN/NNUE.cs

          echo "Native Horsie bindings are disabled."
          echo "Using Lizard's managed ARM SIMD implementation."

      - name: Restore Dependencies
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore Lizard.csproj \
            -r linux-bionic-arm64

      - name: Publish ARM64 Native AOT Executable
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$ANDROID_NDK_BIN:$PATH"

          dotnet publish Lizard.csproj \
            -c Release \
            -r linux-bionic-arm64 \
            --self-contained true \
            -p:PublishAot=true \
            -p:PublishAotUsingRuntimePack=true \
            -p:DisableUnsupportedError=true \
            -p:PublishSingleFile=false \
            -p:UseAppHost=true \
            -p:IS_AOT=true \
            -p:InvariantGlobalization=true \
            -p:PublishReadyToRun=false \
            -p:StripSymbols=false

      - name: Verify Executable
        shell: bash
        run: |
          set -euo pipefail

          echo "Published files:"
          find bin/Release -type f -path '*/publish/*' -print

          BIN="$(find bin/Release -type f \
            -path '*/publish/Lizard' -print -quit)"

          if [ -z "$BIN" ]; then
            echo "::error::Lizard executable was not found."
            find bin/Release -type f | head -100
            exit 1
          fi

          echo "Executable: $BIN"
          file "$BIN"

          readelf -h "$BIN" | grep -E 'Class:|Machine:'

          if ! readelf -h "$BIN" | grep -q 'AArch64'; then
            echo "::error::Output is not an ARM64 executable."
            exit 1
          fi

          echo "Dynamic dependencies:"
          readelf -d "$BIN" | grep NEEDED || true

          echo "Checking for .NET host markers:"
          strings "$BIN" | grep -im 5 -E \
            'hostfxr_main|hostpolicy|Download the .NET runtime' || true

          mkdir -p artifacts
          install -m 755 "$BIN" artifacts/Lizard
          ls -lah artifacts

      - name: Upload Android ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lizard-android-arm64-native-aot
          path: artifacts/Lizard
          if-no-files-found: error
