name: Lizard Android Native AOT Build

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build-android:
    name: Lizard Android ARM64 Native AOT
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Android NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK_VERSION="27.2.12479018"
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found: $SDKMANAGER"
            find /usr/local/lib/android -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;$NDK_VERSION"

          NDK_ROOT="$SDK_ROOT/ndk/$NDK_VERSION"
          NDK_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$NDK_BIN/aarch64-linux-android35-clang++"

          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_BIN=$NDK_BIN" >> "$GITHUB_ENV"
          echo "$NDK_BIN" >> "$GITHUB_PATH"

      - name: Prepare SIMD Bindings
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d Bindings ]; then
            echo "::error::Bindings directory not found. This workflow expects the repository's existing SIMD binding source."
            exit 1
          fi

          if [ ! -f Bindings/SIMD.cpp ]; then
            echo "::error::Bindings/SIMD.cpp not found."
            find Bindings -maxdepth 2 -type f
            exit 1
          fi

          if [ ! -d Bindings/simde ]; then
            git clone --depth 1 https://github.com/simd-everywhere/simde.git simde-repo
            cp -a simde-repo/simde Bindings/simde
          fi

      - name: Compile Android ARM64 SIMD Bindings
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_NDK_BIN/aarch64-linux-android35-clang++" \
            -std=c++20 \
            -O3 \
            -march=armv8-a+simd \
            -fPIC \
            -shared \
            -DSIMDE_NO_NATIVE \
            -DSIMDE_ENABLE_NATIVE_ALIASES \
            -I./Bindings \
            -o HorsieBindings.so \
            ./Bindings/SIMD.cpp \
            -pthread

          file HorsieBindings.so

      - name: Verify Project Configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f Lizard.csproj

          echo "Project configuration before publishing:"
          grep -nE 'TargetFramework|PublishAot|PublishSingleFile|RuntimeIdentifier|RuntimeIdentifiers' Lizard.csproj || true

          # Disable single-file publishing because Native AOT cannot use it.
          # Enable AOT explicitly in the publish command below.

          if grep -q '<PublishSingleFile>true</PublishSingleFile>' Lizard.csproj; then
            sed -i 's|<PublishSingleFile>true</PublishSingleFile>|<PublishSingleFile>false</PublishSingleFile>|g' Lizard.csproj
          fi

          echo "Project configuration after adjustment:"
          grep -nE 'TargetFramework|PublishAot|PublishSingleFile|RuntimeIdentifier|RuntimeIdentifiers' Lizard.csproj || true

      - name: Restore Dependencies
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Lizard.csproj -r linux-bionic-arm64

      - name: Publish Native AOT Executable
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$ANDROID_NDK_BIN:$PATH"

          dotnet publish Lizard.csproj \
            -c Release \
            -r linux-bionic-arm64 \
            --self-contained true \
            -p:PublishAot=true \
            -p:PublishSingleFile=false \
            -p:UseAppHost=true \
            -p:InvariantGlobalization=true \
            -p:PublishTrimmed=true \
            -p:PublishReadyToRun=false \
            -p:StripSymbols=false \
            -p:BINDINGS=HorsieBindings.so

      - name: Locate and Verify Native AOT Output
        shell: bash
        run: |
          set -euo pipefail

          echo "Published files:"
          find bin/Release -type f -path '*/publish/*' -print

          BIN="$(find bin/Release -type f -path '*/publish/Lizard' -print -quit)"

          if [ -z "$BIN" ]; then
            echo "::error::Native Lizard executable was not found."
            exit 1
          fi

          echo "Selected executable: $BIN"
          file "$BIN"

          readelf -h "$BIN" | grep -E 'Class:|Machine:'
          readelf -l "$BIN" | grep -i interpreter || true

          if ! readelf -h "$BIN" | grep -q 'AArch64'; then
            echo "::error::Output is not an AArch64 executable."
            exit 1
          fi

          if strings "$BIN" | grep -E -m 5 'hostfxr_main|hostpolicy|Download the .NET runtime'; then
            echo "::warning::Found .NET host-related strings; inspect the output before treating it as a standalone Native AOT engine."
          fi

          mkdir -p artifacts
          install -m 755 "$BIN" artifacts/Lizard

          if [ -f HorsieBindings.so ]; then
            install -m 644 HorsieBindings.so artifacts/HorsieBindings.so
          fi

          ls -lah artifacts

      - name: Upload Android ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lizard-android-arm64-native-aot
          path: artifacts/*
          if-no-files-found: error
