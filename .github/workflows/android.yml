name: Lizard Android Native Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-android:
    name: Lizard Android Native (aarch64)
    runs-on: ubuntu-24.04

    steps:
    - name: Clone Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Set up Android NDK Environment
      run: |
        NDKV="27.2.12479018"
        ANDROID_ROOT=/usr/local/lib/android
        ANDROID_SDK_ROOT=$ANDROID_ROOT/sdk
        SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
        echo "y" | $SDKMANAGER "ndk;$NDKV"
        ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDKV
        ANDROID_NDK_BIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
        
        echo "ANDROID_NDK_BIN=$ANDROID_NDK_BIN" >> $GITHUB_ENV
        echo "TOOLCHAIN_PREFIX=$ANDROID_NDK_BIN/aarch64-linux-android35-" >> $GITHUB_ENV

    - name: Download SIMDe and Patch C++ Bindings
      run: |
        git clone --depth 1 https://github.com/simd-everywhere/simde.git simde-repo
        mv simde-repo/simde Bindings/simde
        
        find Bindings -type f \( -name "*.h" -o -name "*.cpp" \) -exec sed -i '/#include <immintrin.h>/d' {} +
        find Bindings -type f \( -name "*.h" -o -name "*.cpp" \) -exec sed -i '/#include <xmmintrin.h>/d' {} +

        sed -i '1i #define SIMDE_NO_NATIVE\n#define SIMDE_ENABLE_NATIVE_ALIASES\n#include "simde/x86/avx2.h"\n#include "simde/x86/fma.h"' Bindings/simd.h

        sed -i 's/u16 nnzIndices\(\[.*\]\) alignas(32);/alignas(32) u16 nnzIndices\1;/g' Bindings/SIMD.cpp
        sed -i 's/i8 FTOutputs\(\[.*\]\) alignas(32);/alignas(32) i8 FTOutputs\1;/g' Bindings/SIMD.cpp
        sed -i 's/vec_i32 L1Temp\(\[.*\]\) alignas(32) = {};/alignas(32) vec_i32 L1Temp\1 = {};/g' Bindings/SIMD.cpp
        sed -i 's/float L1Outputs\(\[.*\]\) alignas(32);/alignas(32) float L1Outputs\1;/g' Bindings/SIMD.cpp
        sed -i 's/vec_ps L2Outputs\(\[.*\]\) alignas(32);/alignas(32) vec_ps L2Outputs\1;/g' Bindings/SIMD.cpp

    - name: Cross-Compile C++ SIMD Bindings for Android AArch64
      run: |
        export PATH=${{ env.ANDROID_NDK_BIN }}:$PATH
        
        ${{ env.TOOLCHAIN_PREFIX }}clang++ \
          -std=c++20 \
          -O3 \
          -funroll-loops \
          -march=armv8-a+simd \
          -DSIMDE_ENABLE_NATIVE_ALIASES \
          -DSIMDE_NO_NATIVE \
          -I./Bindings \
          -fPIC \
          -shared \
          -o HorsieBindings.so \
          ./Bindings/SIMD.cpp \
          -pthread

    - name: Publish .NET Application for Android ARM64
      run: |
        dotnet publish . \
          -c Release \
          -r android-arm64 \
          --self-contained true \
          -p:AssemblyName=Lizard \
          -p:BINDINGS=HorsieBindings.so \
          -p:UseAppHost=true \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          -p:PublishTrimmed=false

    - name: Upload Binary Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lizard-android-native-arm64
        path: |
          bin/Release/**/publish/Lizard
          bin/Release/**/publish/HorsieBindings.so
          HorsieBindings.so
