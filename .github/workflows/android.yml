name: Lizard Android Native AOT Build

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build-android:
    name: Lizard Android ARM64 Native AOT
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Android NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK_VERSION="27.2.12479018"
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found."
            find /usr/local/lib/android -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;$NDK_VERSION"

          NDK_ROOT="$SDK_ROOT/ndk/$NDK_VERSION"
          NDK_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$NDK_BIN/aarch64-linux-android35-clang++"

          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_BIN=$NDK_BIN" >> "$GITHUB_ENV"
          echo "$NDK_BIN" >> "$GITHUB_PATH"

      - name: Prepare SIMDe
        shell: bash
        run: |
          set -euo pipefail

          test -f Bindings/SIMD.cpp
          test -f Bindings/simd.h

          if [ ! -f Bindings/simde/x86/avx2.h ]; then
            git clone --depth 1 \
              https://github.com/simd-everywhere/simde.git \
              /tmp/simde-repo

            mkdir -p Bindings/simde
            cp -a /tmp/simde-repo/simde/. Bindings/simde/
          fi

          echo "SIMDe headers are ready."

      - name: Patch ARM64 SIMD Source
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("Bindings/SIMD.cpp")
          source = path.read_text()

          pattern = re.compile(
              r'^(\s*)'
              r'(u16 nnzIndices\[[^\]]+\]|'
              r'i8 FTOutputs\[[^\]]+\]|'
              r'vec_i32 L1Temp\[[^\]]+\]|'
              r'float L1Outputs\[[^\]]+\]|'
              r'vec_ps L2Outputs\[[^\]]+\])'
              r'\s+alignas\(32\)'
              r'(\s*=\s*\{\})?;',
              re.MULTILINE
          )

          source, count = pattern.subn(
              lambda m: f"{m.group(1)}alignas(32) "
                        f"{m.group(2)}{m.group(3) or ''};",
              source
          )

          if count != 5:
              print(f"Expected to patch 5 alignment declarations; patched {count}.")
              print("Current matching declarations:")
              for number, line in enumerate(source.splitlines(), 1):
                  if "alignas(32)" in line:
                      print(f"{number}: {line}")
              raise SystemExit(
                  "Source layout differs from the expected version; refusing to continue."
              )

          path.write_text(source)
          print("Patched all five alignment declarations.")

          for line in source.splitlines():
              if "alignas(32)" in line:
                  print(line)
          PY

          if grep -nE \
            'nnzIndices.*alignas|FTOutputs.*alignas|L1Temp.*alignas|L1Outputs.*alignas|L2Outputs.*alignas' \
            Bindings/SIMD.cpp; then
            echo "::error::Alignment declarations remain in the old format."
            exit 1
          fi

      - name: Compile Android ARM64 SIMD Bindings
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_NDK_BIN/aarch64-linux-android35-clang++" \
            -std=c++20 \
            -O3 \
            -funroll-loops \
            -march=armv8-a+simd \
            -DSIMDE_NO_NATIVE \
            -DSIMDE_ENABLE_NATIVE_ALIASES \
            -I./Bindings \
            -fPIC \
            -shared \
            -o HorsieBindings.so \
            ./Bindings/SIMD.cpp \
            -pthread

          file HorsieBindings.so
          readelf -h HorsieBindings.so | grep -E 'Class:|Machine:'

      - name: Configure Runtime Identifier
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q '<RuntimeIdentifiers>' Lizard.csproj; then
            sed -i \
              's|<TargetFramework>|<RuntimeIdentifiers>linux-bionic-arm64</RuntimeIdentifiers>\n    <TargetFramework>|' \
              Lizard.csproj
          fi

          echo "Project publishing properties:"
          grep -nE \
            'TargetFramework|RuntimeIdentifier|PublishAot|PublishSingleFile' \
            Lizard.csproj || true

      - name: Restore Dependencies
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Lizard.csproj -r linux-bionic-arm64

      - name: Publish Native AOT Executable
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$ANDROID_NDK_BIN:$PATH"

          dotnet publish Lizard.csproj \
            -c Release \
            -r linux-bionic-arm64 \
            --self-contained true \
            -p:PublishAot=true \
            -p:PublishSingleFile=false \
            -p:UseAppHost=true \
            -p:InvariantGlobalization=true \
            -p:PublishTrimmed=false \
            -p:PublishReadyToRun=false \
            -p:StripSymbols=false \
            -p:BINDINGS=HorsieBindings.so

      - name: Verify Native Output
        shell: bash
        run: |
          set -euo pipefail

          BIN="$(find bin/Release -type f \
            -path '*/publish/Lizard' -print -quit)"

          if [ -z "$BIN" ]; then
            echo "::error::Published Lizard executable not found."
            find bin/Release -type f | head -100
            exit 1
          fi

          echo "Executable: $BIN"
          file "$BIN"
          readelf -h "$BIN" | grep -E 'Class:|Machine:'
          readelf -l "$BIN" | grep -i interpreter || true

          if ! readelf -h "$BIN" | grep -q 'AArch64'; then
            echo "::error::Output is not an AArch64 executable."
            exit 1
          fi

          mkdir -p artifacts
          install -m 755 "$BIN" artifacts/Lizard
          install -m 644 HorsieBindings.so artifacts/HorsieBindings.so

          ls -lah artifacts

      - name: Upload Android ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lizard-android-arm64-native-aot
          path: artifacts/*
          if-no-files-found: error
