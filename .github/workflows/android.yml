name: Lizard Android Native AOT Build

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build-android:
    name: Lizard Android ARM64 Native AOT
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Android NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK_VERSION="27.2.12479018"
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found."
            find /usr/local/lib/android -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;$NDK_VERSION"

          NDK_ROOT="$SDK_ROOT/ndk/$NDK_VERSION"
          NDK_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$NDK_BIN/aarch64-linux-android35-clang++"

          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_BIN=$NDK_BIN" >> "$GITHUB_ENV"
          echo "$NDK_BIN" >> "$GITHUB_PATH"

      - name: Prepare SIMDe and Patch SIMD Source
        shell: bash
        run: |
          set -euo pipefail

          test -f Bindings/SIMD.cpp
          test -f Bindings/simd.h

          mkdir -p Bindings/simde

          if [ ! -f Bindings/simde/x86/avx2.h ]; then
            git clone --depth 1 \
              https://github.com/simd-everywhere/simde.git \
              /tmp/simde-repo

            cp -a /tmp/simde-repo/simde/. Bindings/simde/
          fi

          # Remove x86-only headers from the binding source.
          # simd.h already includes SIMDe's AVX2 and FMA compatibility headers.
          find Bindings -type f \
            \( -name "*.cpp" -o -name "*.h" \) \
            -exec sed -i -E \
              '/^[[:space:]]*#[[:space:]]*include[[:space:]]*[<"]immintrin\.h[>"]/d;
               /^[[:space:]]*#[[:space:]]*include[[:space:]]*[<"]xmmintrin\.h[>"]/d' {} +

          echo "Checking for remaining x86-only header includes:"
          if grep -R -n -E \
            '#[[:space:]]*include[[:space:]]*[<"](immintrin|xmmintrin)\.h[>"]' \
            Bindings; then
            echo "::error::An x86-only intrinsic header remains."
            exit 1
          fi

          echo "SIMDe headers:"
          test -f Bindings/simde/x86/avx2.h
          test -f Bindings/simde/x86/fma.h

          echo "SIMD source preparation completed."

      - name: Compile Android ARM64 SIMD Bindings
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_NDK_BIN/aarch64-linux-android35-clang++" \
            -std=c++20 \
            -O3 \
            -funroll-loops \
            -march=armv8-a+simd \
            -DSIMDE_NO_NATIVE \
            -DSIMDE_ENABLE_NATIVE_ALIASES \
            -I./Bindings \
            -fPIC \
            -shared \
            -o HorsieBindings.so \
            ./Bindings/SIMD.cpp \
            -pthread

          file HorsieBindings.so
          readelf -h HorsieBindings.so | grep -E 'Class:|Machine:'

      - name: Configure Android Runtime Identifier
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q '<RuntimeIdentifiers>' Lizard.csproj; then
            sed -i \
              's|<TargetFramework>|<RuntimeIdentifiers>linux-bionic-arm64</RuntimeIdentifiers>\n    <TargetFramework>|' \
              Lizard.csproj
          fi

          grep -nE \
            'TargetFramework|RuntimeIdentifiers|PublishAot|PublishSingleFile' \
            Lizard.csproj || true

      - name: Restore Dependencies
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Lizard.csproj -r linux-bionic-arm64

      - name: Publish Native AOT Executable
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$ANDROID_NDK_BIN:$PATH"

          dotnet publish Lizard.csproj \
            -c Release \
            -r linux-bionic-arm64 \
            --self-contained true \
            -p:PublishAot=true \
            -p:PublishSingleFile=false \
            -p:UseAppHost=true \
            -p:InvariantGlobalization=true \
            -p:PublishTrimmed=false \
            -p:PublishReadyToRun=false \
            -p:StripSymbols=false \
            -p:BINDINGS=HorsieBindings.so

      - name: Verify Native Executable
        shell: bash
        run: |
          set -euo pipefail

          BIN="$(find bin/Release -type f \
            -path '*/publish/Lizard' -print -quit)"

          if [ -z "$BIN" ]; then
            echo "::error::Published Lizard executable not found."
            find bin/Release -type f | head -100
            exit 1
          fi

          echo "Executable: $BIN"
          file "$BIN"
          readelf -h "$BIN" | grep -E 'Class:|Machine:'
          readelf -l "$BIN" | grep -i interpreter || true

          if ! readelf -h "$BIN" | grep -q 'AArch64'; then
            echo "::error::Executable is not ARM64."
            exit 1
          fi

          mkdir -p artifacts
          install -m 755 "$BIN" artifacts/Lizard
          install -m 644 HorsieBindings.so artifacts/HorsieBindings.so

          echo "Artifact files:"
          ls -lah artifacts

      - name: Upload Android ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lizard-android-arm64-native-aot
          path: artifacts/*
          if-no-files-found: error
