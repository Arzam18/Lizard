name: Lizard Android ARM64

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Android NDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="/usr/local/lib/android/sdk"
          NDK_VERSION="27.2.12479018"
          NDK="$SDK_ROOT/ndk/$NDK_VERSION"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "Looking for sdkmanager..."

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -name sdkmanager \
            -type f \
            | sort \
            | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using:"
          echo "$SDKMANAGER"

          echo
          echo "Installing Android NDK $NDK_VERSION..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "ndk;$NDK_VERSION"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: NDK not found:"
            echo "$NDK"
            exit 1
          fi

          CXX="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"

          if [ ! -x "$CXX" ]; then
            echo "ERROR: Android ARM64 compiler not found:"
            echo "$CXX"
            exit 1
          fi

          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_BIN=$TOOLCHAIN/bin" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "Android NDK"
          echo "========================================"
          echo "$NDK"
          echo
          echo "Compiler:"
          echo "$CXX"
          echo "========================================"

          "$CXX" --version

      - name: Check SIMDe
        shell: bash
        run: |
          set -e

          if [ ! -d "Bindings/simde" ]; then
            echo "SIMDe is not present in Bindings/simde."
            echo "Downloading SIMDe..."

            git clone \
              --depth 1 \
              https://github.com/simd-everywhere/simde.git \
              /tmp/simde

            mkdir -p Bindings

            rm -rf Bindings/simde

            cp -R /tmp/simde/simde Bindings/simde
          fi

          echo "SIMDe:"
          ls -ld Bindings/simde

      - name: Patch C++ bindings for Android
        shell: bash
        run: |
          set -e

          echo "Removing x86-only compiler includes..."

          find Bindings \
            -type f \
            \( -name '*.h' -o -name '*.cpp' \) \
            -exec sed -i '/#include <immintrin.h>/d' {} \;

          find Bindings \
            -type f \
            \( -name '*.h' -o -name '*.cpp' \) \
            -exec sed -i '/#include <xmmintrin.h>/d' {} \;

          echo
          echo "Checking SIMD header..."

          if [ ! -f "Bindings/simd.h" ]; then
            echo "ERROR: Bindings/simd.h not found"
            exit 1
          fi

          echo
          echo "SIMD header:"
          sed -n '1,30p' Bindings/simd.h

      - name: Build HorsieBindings.so
        shell: bash
        run: |
          set -e

          CXX="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"

          echo "========================================"
          echo "Building HorsieBindings.so"
          echo "========================================"

          "$CXX" \
            -std=c++20 \
            -O3 \
            -funroll-loops \
            -march=armv8-a+simd \
            -fPIC \
            -shared \
            -pthread \
            -I./Bindings \
            -I./Bindings/simde \
            -o HorsieBindings.so \
            ./Bindings/SIMD.cpp

          echo
          echo "========================================"
          echo "HorsieBindings.so built"
          echo "========================================"

          file HorsieBindings.so

          echo
          echo "ELF:"
          "$ANDROID_NDK_BIN/llvm-readelf" \
            -h HorsieBindings.so \
            | grep -E 'Class:|Machine:|Type:' || true

          echo
          ls -lh HorsieBindings.so

      - name: Restore .NET project
        shell: bash
        run: |
          set -e

          dotnet restore . \
            -r linux-bionic-arm64

      - name: Publish Lizard NativeAOT ARM64
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Publishing Lizard NativeAOT"
          echo "========================================"

          dotnet publish . \
            -c Release \
            -r linux-bionic-arm64 \
            --self-contained true \
            -p:AssemblyName=Lizard \
            -p:BINDINGS=HorsieBindings.so \
            -p:PublishAot=true \
            -p:PublishSingleFile=false \
            -p:IS_AOT=true \
            -p:IlcInstructionSet=armv8-a \
            -p:InvariantGlobalization=true

          echo
          echo "Publish complete."

      - name: Verify Lizard
        shell: bash
        run: |
          set -e

          BINARY="$(find bin/Release \
            -type f \
            -path '*/publish/Lizard' \
            | head -n 1)"

          if [ -z "$BINARY" ]; then
            echo "ERROR: Lizard executable not found."
            exit 1
          fi

          echo "========================================"
          echo "Lizard executable"
          echo "========================================"
          echo "$BINARY"

          echo
          echo "File:"
          file "$BINARY"

          echo
          echo "ELF:"
          "$ANDROID_NDK_BIN/llvm-readelf" \
            -h "$BINARY" \
            | grep -E 'Class:|Machine:|Type:' || true

          echo
          echo "Dynamic dependencies:"
          "$ANDROID_NDK_BIN/llvm-readelf" \
            -d "$BINARY" || true

          echo
          echo "Checking libhostfxr..."

          if strings "$BINARY" | grep -q 'libhostfxr.so'; then
            echo "WARNING: libhostfxr.so reference detected."
          else
            echo "OK: no libhostfxr.so reference detected."
          fi

          echo
          echo "Checking architecture..."

          if file "$BINARY" | grep -qi 'ELF 64-bit.*ARM aarch64'; then
            echo "OK: AArch64 confirmed."
          else
            echo "ERROR: Lizard is not AArch64."
            exit 1
          fi

          echo
          echo "Size:"
          ls -lh "$BINARY"

      - name: Prepare artifact
        shell: bash
        run: |
          set -e

          BINARY="$(find bin/Release \
            -type f \
            -path '*/publish/Lizard' \
            | head -n 1)"

          if [ -z "$BINARY" ]; then
            echo "ERROR: Lizard not found."
            exit 1
          fi

          rm -rf android-artifact
          mkdir -p android-artifact

          cp "$BINARY" android-artifact/Lizard
          cp HorsieBindings.so android-artifact/HorsieBindings.so

          chmod +x android-artifact/Lizard

          echo "========================================"
          echo "FINAL ARTIFACT"
          echo "========================================"

          ls -lh android-artifact

          echo
          file android-artifact/Lizard
          file android-artifact/HorsieBindings.so

      - name: Upload Android ARM64 engine
        uses: actions/upload-artifact@v4
        with:
          name: lizard-android-arm64
          path: android-artifact/
          if-no-files-found: error
