name: Lizard Android ARM64

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Android NDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="/usr/local/lib/android/sdk"
          NDK_VERSION="27.2.12479018"
          NDK="$SDK_ROOT/ndk/$NDK_VERSION"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -name sdkmanager \
            -type f \
            | sort \
            | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses >/dev/null 2>&1 || true

          echo
          echo "Installing Android NDK $NDK_VERSION..."

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "ndk;$NDK_VERSION"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: NDK not found:"
            echo "$NDK"
            exit 1
          fi

          CXX="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"

          if [ ! -x "$CXX" ]; then
            echo "ERROR: AArch64 compiler not found:"
            echo "$CXX"
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_BIN=$TOOLCHAIN/bin" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "Android NDK"
          echo "========================================"
          echo "$NDK"
          echo
          echo "Compiler:"
          echo "$CXX"
          echo "========================================"

          "$CXX" --version

      - name: Download SIMDe
        shell: bash
        run: |
          set -e

          rm -rf /tmp/simde

          git clone \
            --depth 1 \
            https://github.com/simd-everywhere/simde.git \
            /tmp/simde

          rm -rf Bindings/simde

          mkdir -p Bindings

          cp -R /tmp/simde/simde Bindings/simde

          echo
          echo "SIMDe installed:"
          ls -ld Bindings/simde

          test -f Bindings/simde/x86/avx2.h
          test -f Bindings/simde/x86/fma.h

      - name: Patch SIMD sources for ARM64
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          simd_cpp = Path("Bindings/SIMD.cpp")
          simd_h = Path("Bindings/simd.h")

          if not simd_cpp.exists():
              raise SystemExit("ERROR: Bindings/SIMD.cpp not found")

          if not simd_h.exists():
              raise SystemExit("ERROR: Bindings/simd.h not found")

          simde_cpp_headers = """#define SIMDE_ENABLE_NATIVE_ALIASES
          #include "simde/x86/avx2.h"
          #include "simde/x86/fma.h"
          """

          # ------------------------------------------------------------
          # Patch SIMD.cpp
          # ------------------------------------------------------------

          text = simd_cpp.read_text()

          if "#include <immintrin.h>" in text:
              text = text.replace(
                  "#include <immintrin.h>",
                  simde_cpp_headers.rstrip(),
                  1
              )

          if "#include <xmmintrin.h>" in text:
              text = text.replace(
                  "#include <xmmintrin.h>",
                  "",
                  1
              )

          simd_cpp.write_text(text)

          # ------------------------------------------------------------
          # Patch simd.h
          # ------------------------------------------------------------

          text = simd_h.read_text()

          if "#include <immintrin.h>" in text:
              text = text.replace(
                  "#include <immintrin.h>",
                  simde_cpp_headers.rstrip(),
                  1
              )

          if "#include <xmmintrin.h>" in text:
              text = text.replace(
                  "#include <xmmintrin.h>",
                  "",
                  1
              )

          if '#include "simde/x86/avx2.h"' not in text:
              lines = text.splitlines()

              insert_at = 0

              if lines and lines[0].strip() == "#pragma once":
                  insert_at = 1

              lines[insert_at:insert_at] = [
                  "",
                  "#define SIMDE_ENABLE_NATIVE_ALIASES",
                  '#include "simde/x86/avx2.h"',
                  '#include "simde/x86/fma.h"',
                  "",
              ]

              text = "\n".join(lines) + "\n"

          simd_h.write_text(text)

          PY

          echo
          echo "========================================"
          echo "Bindings/SIMD.cpp"
          echo "========================================"

          sed -n '1,20p' Bindings/SIMD.cpp

          echo
          echo "========================================"
          echo "Bindings/simd.h"
          echo "========================================"

          sed -n '1,25p' Bindings/simd.h

          echo
          echo "========================================"
          echo "Checking Lizard source headers"
          echo "========================================"

          if grep -n \
            -E '#include[[:space:]]*[<"](immintrin|xmmintrin)\.h[>"]' \
            Bindings/SIMD.cpp \
            Bindings/simd.h; then

            echo
            echo "ERROR: Direct x86 intrinsic header remains in Lizard source."
            exit 1
          fi

          echo "OK: Lizard source contains no direct immintrin.h/xmmintrin.h."

      - name: Build HorsieBindings.so
        shell: bash
        run: |
          set -e

          CXX="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"

          echo
          echo "========================================"
          echo "Building HorsieBindings.so"
          echo "========================================"

          "$CXX" \
            -std=c++20 \
            -O3 \
            -funroll-loops \
            -march=armv8-a+simd \
            -fPIC \
            -shared \
            -pthread \
            -I./Bindings \
            -I./Bindings/simde \
            -o HorsieBindings.so \
            ./Bindings/SIMD.cpp

          echo
          echo "========================================"
          echo "HorsieBindings.so BUILD SUCCESS"
          echo "========================================"

          echo
          echo "File:"
          file HorsieBindings.so

          echo
          echo "ELF:"
          "$ANDROID_NDK_BIN/llvm-readelf" \
            -h HorsieBindings.so \
            | grep -E 'Class:|Machine:|Type:' || true

          echo
          echo "Size:"
          ls -lh HorsieBindings.so

      - name: Add Android ARM64 RID
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path("Lizard.csproj")
          text = path.read_text(encoding="utf-8-sig")

          if "<RuntimeIdentifiers>" not in text:
              marker = "<TargetFramework>"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: TargetFramework element not found."
                  )

              text = text.replace(
                  marker,
                  "<RuntimeIdentifiers>linux-bionic-arm64</RuntimeIdentifiers>\n    <TargetFramework>",
                  1
              )

          path.write_text(text, encoding="utf-8")

          print("Runtime identifier configured:")

          for line in text.splitlines():
              if "RuntimeIdentifiers" in line:
                  print(line)

      - name: Restore Lizard
        shell: bash
        run: |
          set -e

          echo
          echo "========================================"
          echo "Restoring Lizard"
          echo "========================================"

          dotnet restore . \
            -r linux-bionic-arm64

      - name: Publish Lizard NativeAOT ARM64
        shell: bash
        run: |
          set -e

          echo
          echo "========================================"
          echo "Publishing Lizard NativeAOT ARM64"
          echo "========================================"

          dotnet publish . \
            -c Release \
            -r linux-bionic-arm64 \
            --self-contained true \
            -p:AssemblyName=Lizard \
            -p:BINDINGS=HorsieBindings.so \
            -p:PublishAot=true \
            -p:PublishSingleFile=false \
            -p:IS_AOT=true \
            -p:IlcInstructionSet=armv8-a \
            -p:InvariantGlobalization=true

          echo
          echo "Publish completed."

      - name: Locate Lizard
        shell: bash
        run: |
          set -e

          echo "Published files:"

          find bin/Release \
            -type f \
            -path '*/publish/*' \
            -print

          BINARY="$(find bin/Release \
            -type f \
            -path '*/publish/Lizard' \
            | head -n 1)"

          if [ -z "$BINARY" ]; then
            echo
            echo "ERROR: Lizard executable not found."
            exit 1
          fi

          echo
          echo "Lizard executable:"
          echo "$BINARY"

          echo "LIZARD_BINARY=$BINARY" >> "$GITHUB_ENV"

      - name: Verify Lizard NativeAOT
        shell: bash
        run: |
          set -e

          BINARY="$LIZARD_BINARY"

          echo
          echo "========================================"
          echo "LIZARD"
          echo "========================================"

          file "$BINARY"

          echo
          echo "========================================"
          echo "ELF HEADER"
          echo "========================================"

          "$ANDROID_NDK_BIN/llvm-readelf" \
            -h "$BINARY" \
            | grep -E 'Class:|Machine:|Type:' || true

          echo
          echo "========================================"
          echo "DYNAMIC DEPENDENCIES"
          echo "========================================"

          "$ANDROID_NDK_BIN/llvm-readelf" \
            -d "$BINARY" || true

          echo
          echo "========================================"
          echo "CHECKING libhostfxr"
          echo "========================================"

          if strings "$BINARY" | grep -q 'libhostfxr.so'; then
            echo "WARNING: libhostfxr.so reference detected."
          else
            echo "OK: no libhostfxr.so reference detected."
          fi

          echo
          echo "========================================"
          echo "CHECKING AARCH64"
          echo "========================================"

          if file "$BINARY" | grep -qi 'ELF 64-bit.*ARM aarch64'; then
            echo "OK: AArch64 ELF confirmed."
          else
            echo "ERROR: output is not AArch64."
            exit 1
          fi

          echo
          echo "========================================"
          echo "SIZE"
          echo "========================================"

          ls -lh "$BINARY"

      - name: Prepare Android artifact
        shell: bash
        run: |
          set -e

          rm -rf android-artifact
          mkdir -p android-artifact

          cp "$LIZARD_BINARY" \
            android-artifact/Lizard

          cp HorsieBindings.so \
            android-artifact/HorsieBindings.so

          chmod +x \
            android-artifact/Lizard

          echo
          echo "========================================"
          echo "FINAL ARTIFACT"
          echo "========================================"

          ls -lh android-artifact

          echo
          echo "Lizard:"
          file android-artifact/Lizard

          echo
          echo "HorsieBindings:"
          file android-artifact/HorsieBindings.so

      - name: Upload Android ARM64 engine
        uses: actions/upload-artifact@v4
        with:
          name: lizard-android-arm64
          path: android-artifact/
          if-no-files-found: error
