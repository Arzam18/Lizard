name: Lizard Android ARM64

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Android NDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="/usr/local/lib/android/sdk"
          NDK_VERSION="27.2.12479018"
          NDK="$SDK_ROOT/ndk/$NDK_VERSION"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -name sdkmanager \
            -type f \
            | sort \
            | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo
          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses >/dev/null 2>&1 || true

          echo
          echo "Installing Android NDK $NDK_VERSION..."

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "ndk;$NDK_VERSION"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: NDK was not installed:"
            echo "$NDK"
            exit 1
          fi

          CXX="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"

          if [ ! -x "$CXX" ]; then
            echo "ERROR: AArch64 Android compiler not found:"
            echo "$CXX"
            exit 1
          fi

          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_BIN=$TOOLCHAIN/bin" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "Android NDK"
          echo "========================================"
          echo "$NDK"
          echo
          echo "Compiler:"
          echo "$CXX"
          echo "========================================"

          "$CXX" --version

      - name: Check SIMDe
        shell: bash
        run: |
          set -e

          if [ -d "Bindings/simde" ]; then
            echo "Existing SIMDe installation found:"
            ls -ld Bindings/simde
          else
            echo "SIMDe not found. Downloading..."

            git clone \
              --depth 1 \
              https://github.com/simd-everywhere/simde.git \
              /tmp/simde

            mkdir -p Bindings

            cp -R /tmp/simde/simde Bindings/simde

            echo
            echo "SIMDe installed:"
            ls -ld Bindings/simde
          fi

      - name: Configure SIMDe for Android ARM64
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path("Bindings/simd.h")

          if not path.exists():
              raise SystemExit(
                  "ERROR: Bindings/simd.h does not exist"
              )

          text = path.read_text()

          simde_block = """#define SIMDE_ENABLE_NATIVE_ALIASES
          #include "simde/x86/avx2.h"
          #include "simde/x86/fma.h"
          """

          if '#include "simde/x86/avx2.h"' not in text:
              if '#include <immintrin.h>' in text:
                  text = text.replace(
                      '#include <immintrin.h>',
                      simde_block.rstrip(),
                      1
                  )

              elif '#include <x86intrin.h>' in text:
                  text = text.replace(
                      '#include <x86intrin.h>',
                      simde_block.rstrip(),
                      1
                  )

              else:
                  lines = text.splitlines()

                  insert_at = 0

                  if lines and lines[0].strip() == '#pragma once':
                      insert_at = 1

                  lines.insert(
                      insert_at,
                      '#define SIMDE_ENABLE_NATIVE_ALIASES'
                  )
                  lines.insert(
                      insert_at + 1,
                      '#include "simde/x86/avx2.h"'
                  )
                  lines.insert(
                      insert_at + 2,
                      '#include "simde/x86/fma.h"'
                  )

                  text = '\n'.join(lines) + '\n'

          path.write_text(text)
          PY

          echo
          echo "========================================"
          echo "Bindings/simd.h"
          echo "========================================"

          sed -n '1,30p' Bindings/simd.h

          echo
          echo "Checking SIMDe headers..."

          test -f Bindings/simde/x86/avx2.h
          test -f Bindings/simde/x86/fma.h

          echo "SIMDe headers found."

      - name: Build HorsieBindings.so
        shell: bash
        run: |
          set -e

          CXX="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"

          echo
          echo "========================================"
          echo "Building HorsieBindings.so"
          echo "========================================"

          "$CXX" \
            -std=c++20 \
            -O3 \
            -funroll-loops \
            -march=armv8-a+simd \
            -fPIC \
            -shared \
            -pthread \
            -I./Bindings \
            -I./Bindings/simde \
            -o HorsieBindings.so \
            ./Bindings/SIMD.cpp

          echo
          echo "========================================"
          echo "HorsieBindings.so BUILD SUCCESS"
          echo "========================================"

          echo
          echo "File:"
          file HorsieBindings.so

          echo
          echo "ELF:"
          "$ANDROID_NDK_BIN/llvm-readelf" \
            -h HorsieBindings.so \
            | grep -E 'Class:|Machine:|Type:' || true

          echo
          echo "Size:"
          ls -lh HorsieBindings.so

      - name: Restore .NET project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Restoring Lizard"
          echo "========================================"

          dotnet restore . \
            -r linux-bionic-arm64

      - name: Publish Lizard NativeAOT ARM64
        shell: bash
        run: |
          set -e

          echo
          echo "========================================"
          echo "Publishing Lizard NativeAOT ARM64"
          echo "========================================"

          dotnet publish . \
            -c Release \
            -r linux-bionic-arm64 \
            --self-contained true \
            -p:AssemblyName=Lizard \
            -p:BINDINGS=HorsieBindings.so \
            -p:PublishAot=true \
            -p:PublishSingleFile=false \
            -p:IS_AOT=true \
            -p:IlcInstructionSet=armv8-a \
            -p:InvariantGlobalization=true

          echo
          echo "========================================"
          echo "Publish completed"
          echo "========================================"

      - name: Locate Lizard executable
        shell: bash
        run: |
          set -e

          echo "Searching for Lizard..."

          find bin/Release \
            -type f \
            -path '*/publish/*' \
            -print

          BINARY="$(find bin/Release \
            -type f \
            -path '*/publish/Lizard' \
            | head -n 1)"

          if [ -z "$BINARY" ]; then
            echo
            echo "ERROR: Lizard executable was not found."
            exit 1
          fi

          echo
          echo "Lizard:"
          echo "$BINARY"

          echo "LIZARD_BINARY=$BINARY" >> "$GITHUB_ENV"

      - name: Verify Lizard NativeAOT
        shell: bash
        run: |
          set -e

          BINARY="$LIZARD_BINARY"

          echo
          echo "========================================"
          echo "LIZARD FILE"
          echo "========================================"

          file "$BINARY"

          echo
          echo "========================================"
          echo "ELF HEADER"
          echo "========================================"

          "$ANDROID_NDK_BIN/llvm-readelf" \
            -h "$BINARY" \
            | grep -E 'Class:|Machine:|Type:' || true

          echo
          echo "========================================"
          echo "DYNAMIC DEPENDENCIES"
          echo "========================================"

          "$ANDROID_NDK_BIN/llvm-readelf" \
            -d "$BINARY" || true

          echo
          echo "========================================"
          echo "CHECKING libhostfxr.so"
          echo "========================================"

          if strings "$BINARY" | grep -q 'libhostfxr.so'; then
            echo
            echo "WARNING:"
            echo "libhostfxr.so reference detected."
            echo "The executable may still be framework-dependent."
          else
            echo
            echo "OK:"
            echo "No libhostfxr.so reference detected."
          fi

          echo
          echo "========================================"
          echo "CHECKING ARCHITECTURE"
          echo "========================================"

          if file "$BINARY" | grep -qi 'ELF 64-bit.*ARM aarch64'; then
            echo "OK: AArch64 ELF confirmed."
          else
            echo "ERROR: Lizard is not an AArch64 ELF executable."
            exit 1
          fi

          echo
          echo "========================================"
          echo "LIZARD SIZE"
          echo "========================================"

          ls -lh "$BINARY"

      - name: Prepare Android artifact
        shell: bash
        run: |
          set -e

          rm -rf android-artifact
          mkdir -p android-artifact

          cp "$LIZARD_BINARY" \
            android-artifact/Lizard

          cp HorsieBindings.so \
            android-artifact/HorsieBindings.so

          chmod +x \
            android-artifact/Lizard

          echo
          echo "========================================"
          echo "ANDROID ARTIFACT"
          echo "========================================"

          ls -lh android-artifact

          echo
          echo "Lizard:"
          file android-artifact/Lizard

          echo
          echo "HorsieBindings:"
          file android-artifact/HorsieBindings.so

      - name: Upload Android ARM64 engine
        uses: actions/upload-artifact@v4
        with:
          name: lizard-android-arm64
          path: android-artifact/
          if-no-files-found: error
